
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-ai-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-ai-frontend
    env_file:
      - .env
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
